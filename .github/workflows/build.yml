name: Build EXE

on:
  workflow_dispatch: # 允許在 Actions 頁面手動點擊按鈕觸發

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 1. 檢出你的倉庫原始碼
        uses: actions/checkout@v4

      - name: 2. 配置雲端 Node.js 環境並自動編譯前端
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. 搜尋前端目錄並執行 Build
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Path . -Filter "package.json" -Recurse -Depth 2 | Where-Object { $_.FullName -notmatch "node_modules" } | Select-Object -First 1
          if ($pkg) {
            Write-Host "找到前端設定檔: $($pkg.FullName)"
            Push-Location $pkg.DirectoryName
            npm install
            npm run build
            Pop-Location
            $distDir = Join-Path $pkg.DirectoryName "dist"
            if (Test-Path $distDir) {
              Copy-Item -Path $distDir -Destination "./dist_web" -Recurse -Force
            }
          } else {
            Write-Host "未偵測到 package.json，跳過前端編譯。"
          }

      - name: 4. 配置雲端 Python 3.11.9 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'

      - name: 5. 安裝依賴並打包為獨立 EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          
          # 自動搜尋所有 requirements.txt 並安裝
          $reqs = Get-ChildItem -Path . -Filter "requirements.txt" -Recurse -Depth 2
          foreach ($req in $reqs) {
            Write-Host "正在安裝依賴: $($req.FullName)"
            pip install -r $req.FullName
          }
          pip install pyinstaller

          # 自動判斷主程式入口檔案
          $candidates = @("main.py", "app.py", "run.py", "start.py", "server.py", "xianyu.py")
          $entryFile = $null
          foreach ($name in $candidates) {
            $found = Get-ChildItem -Path . -Filter $name -Recurse -Depth 2 | Select-Object -First 1
            if ($found) {
              $entryFile = $found
              break
            }
          }
          if (-not $entryFile) {
            $entryFile = Get-ChildItem -Path . -Filter "*.py" -File | Select-Object -First 1
          }
          Write-Host "使用入口檔案進行打包: $($entryFile.FullName)"

          # 組裝 PyInstaller 參數
          $pyArgs = @("-D", "-c", "--noconfirm", "--name", "XianyuGuanjia")
          if (Test-Path "./dist_web") {
            $pyArgs += @("--add-data", "dist_web;dist")
          }
          $pyArgs += $entryFile.FullName
          pyinstaller @pyArgs

          # 將專案內的設定檔 (.env / .yaml / .json / .ini) 自動複製到打包成品目錄中
          Get-ChildItem -Path . -Include "*.yaml","*.yml","*.json","*.ini",".env*" -File -Recurse -Depth 1 | Where-Object { $_.Name -ne "package.json" -and $_.Name -ne "package-lock.json" } | ForEach-Object {
            Copy-Item $_.FullName -Destination "dist/XianyuGuanjia/" -Force
          }

      - name: 6. 上傳打包成品供下載
        uses: actions/upload-artifact@v4
        with:
          name: XianyuGuanjia-Portable
          path: dist/XianyuGuanjia
